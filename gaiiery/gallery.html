<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Показ поняшек</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>Шлюхи Эквестрии</h1>

    <div class="gallery">
        <div class="card">
            <img src="images/1.jpg" alt="Описание 1">
            <p>Закат на море</p>
        </div>
        <div class="card">
            <img src="images/2.jpg" alt="Описание 2">
            <p>Горы в тумане</p>
        </div>
        <div class="card">
            <img src="images/3.jpg" alt="Описание 3">
            <p>Город ночью</p>
        </div>
        
    </div>

    
    <div id="overlay" class="overlay">
        <span class="close" id="closeBtn">7times;</span>
        <img id="fullImage" src="">
    </div>

    <script src="script.js"></script>
</body>
</html>
